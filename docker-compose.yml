# Docker Compose para DESENVOLVIMENTO
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: tarot-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tarot_insight
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - tarot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tarot-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tarot_insight?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - MERCADOPAGO_ACCESS_TOKEN=${MERCADOPAGO_ACCESS_TOKEN}
      - PORT=3001
      - NODE_ENV=production
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tarot-network
    restart: unless-stopped
    command: sh -c "npx prisma migrate deploy && npm start"

  # Frontend App
  tarot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarot-insight-app
    # On Linux, use host networking in development to avoid docker-proxy/iptables issues
    # This makes the container listen on the host network directly (ports from container are host ports).
    # NOTE: network_mode: host only works on Linux and will bind ports directly on the host.
    network_mode: host
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NODE_ENV=development
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  tarot-network:
    driver: bridge
