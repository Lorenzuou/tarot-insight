version: '3.8'

services:
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - taro-network

  taro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taro-app
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    networks:
      - taro-network

volumes:
  caddy_data:
  caddy_config:

networks:
  taro-network:
    driver: bridge
